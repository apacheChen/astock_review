name: 打包APK(云编译)

on:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: ① 拉取代码
        uses: actions/checkout@v4

      - name: ② 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: ③ 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/android/sdk || true
          df -h /

      - name: ④ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip \
            openjdk-17-jdk autoconf automake libtool libtool-bin pkg-config m4 \
            gettext autopoint patch lbzip2 patchelf cpio rsync xz-utils file \
            zlib1g-dev libncurses-dev libtinfo5 \
            libffi-dev libssl-dev cmake libgl1 libltdl-dev

      - name: ⑤ 指定 Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: ⑥ 安装 buildozer 与 cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: ⑦ 恢复打包缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-v7-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v7-

      - name: ⑧ 编译 APK(黑匣子)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          buildozer android debug 2>&1 | tee build.log
          EXIT=${PIPESTATUS[0]}
          echo ">>> buildozer 退出码: $EXIT"
          if [ "$EXIT" -ne 0 ]; then
            echo ""
            echo "==========【黑匣子】报错关键行(最后60条) =========="
            grep -a -n -i -E "error:|fatal error|ErrorReturnCode|Traceback|No such file|not found|undefined reference|cannot find|Exception|FAILED|No space" build.log | tail -60 || true
            echo ""
            echo "==========【黑匣子】日志末尾 =========="
            tail -160 build.log || true
          fi
          exit $EXIT

      - name: ⑨ 存档完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: ⑩ 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: astock-review-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
